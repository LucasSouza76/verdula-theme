# Garden development environment
services:
  api:
    build: ./api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://verdula:secret@db:5432/garden
      LOG_LEVEL: debug
      CACHE_ENABLED: true
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verdula"]
      interval: 10s
      retries: 5

volumes:
  data:
